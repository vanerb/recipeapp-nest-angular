<div class="page py-10 sm:py-16">
  <div class="mx-auto max-w-md">
    <h1 class="text-4xl">Hola de nuevo</h1>
    <p class="mt-2 text-muted">Entra para valorar, comentar y compartir lo que cocinas.</p>

    <div *ngIf="isDemo" class="mt-6 rounded-2xl bg-herb-soft p-4">
      <p class="font-medium">Prueba la demo con una cuenta de ejemplo</p>
      <div class="mt-3 flex flex-wrap gap-2">
        <button
          *ngFor="let user of demoUsers"
          type="button"
          class="btn-primary"
          [disabled]="loading"
          (click)="enterAs(user.email)"
        >
          Entrar como {{ user.name }}
        </button>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4" novalidate>
      <div>
        <label class="label" for="email">Correo</label>
        <input id="email" class="input" type="email" autocomplete="email" formControlName="email" />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="field-error">
          Introduce un correo válido.
        </p>
      </div>
      <div>
        <label class="label" for="password">Contraseña</label>
        <input id="password" class="input" type="password" autocomplete="current-password" formControlName="password" />
        <p *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="field-error">
          Introduce tu contraseña.
        </p>
        <p *ngIf="isDemo" class="field-hint">En la demo basta con el correo: las contraseñas no se comprueban ni se guardan.</p>
      </div>
      <p *ngIf="error" class="rounded-lg bg-tomato-soft px-3 py-2 text-tomato" role="alert">{{ error }}</p>
      <button type="submit" class="btn-primary w-full" [disabled]="loading">
        {{ loading ? 'Entrando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="mt-6 text-center text-muted">
      ¿Aún no tienes cuenta?
      <a routerLink="/register" class="font-medium text-herb underline underline-offset-4">Créala aquí</a>
    </p>
  </div>
</div>
