<div class="page py-10 sm:py-16">
  <div class="mx-auto max-w-md">
    <h1 class="text-4xl">Crea tu cuenta</h1>
    <p class="mt-2 text-muted">Sube tus recetas y descubre qué se cocina en otras casas.</p>

    <form [formGroup]="form" (ngSubmit)="register()" class="mt-6 space-y-4" novalidate>
      <div>
        <label class="label" for="name">Nombre</label>
        <input id="name" class="input" autocomplete="name" formControlName="name" />
        <p *ngIf="form.get('name')?.touched && form.get('name')?.invalid" class="field-error">Dinos cómo te llamas.</p>
      </div>
      <div>
        <label class="label" for="email">Correo</label>
        <input id="email" class="input" type="email" autocomplete="email" formControlName="email" />
        <p *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="field-error">
          Introduce un correo válido.
        </p>
      </div>
      <div>
        <label class="label" for="password">Contraseña</label>
        <input id="password" class="input" type="password" autocomplete="new-password" formControlName="password" />
        <p
          class="field-hint"
          [class.!text-tomato]="form.get('password')?.touched && form.get('password')?.invalid"
        >
          Mínimo 8 caracteres, con mayúscula, minúscula, número y símbolo.
        </p>
      </div>
      <div>
        <label class="label" for="repeatPassword">Repite la contraseña</label>
        <input id="repeatPassword" class="input" type="password" autocomplete="new-password" formControlName="repeatPassword" />
        <p *ngIf="form.get('repeatPassword')?.touched && form.hasError('mismatch')" class="field-error">
          Las contraseñas no coinciden.
        </p>
      </div>
      <p *ngIf="error" class="rounded-lg bg-tomato-soft px-3 py-2 text-tomato" role="alert">{{ error }}</p>
      <button type="submit" class="btn-primary w-full" [disabled]="loading">
        {{ loading ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="mt-6 text-center text-muted">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="font-medium text-herb underline underline-offset-4">Inicia sesión</a>
    </p>
  </div>
</div>
