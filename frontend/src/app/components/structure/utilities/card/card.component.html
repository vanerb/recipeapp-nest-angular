<article class="group relative flex h-full flex-col">
  <div class="aspect-[4/3] overflow-hidden rounded-2xl bg-line">
    <img
      appImgFallback
      [src]="data.images[0]?.url | media"
      alt=""
      loading="lazy"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.03]"
    />
  </div>
  <div class="mt-3 flex items-center justify-between gap-3 text-[0.9375rem]">
    <span class="truncate font-medium text-tomato">{{ data.category?.name ?? 'Sin categoría' }}</span>
    <span *ngIf="data.ratingsCount > 0; else noRatings" class="flex shrink-0 items-center gap-1">
      <i class="bi bi-star-fill text-saffron" aria-hidden="true"></i>
      <span class="font-medium">{{ data.averageRating | number: '1.1-1' : 'es' }}</span>
      <span class="text-muted">({{ data.ratingsCount }})</span>
    </span>
    <ng-template #noRatings><span class="shrink-0 text-muted">Sin valorar</span></ng-template>
  </div>
  <h3 class="mt-1 text-[1.4rem]">
    <a [routerLink]="['/recipe', data.id]" class="after:absolute after:inset-0 after:rounded-2xl">{{ data.title }}</a>
  </h3>
  <p class="mt-1 line-clamp-2 text-muted">{{ data.description }}</p>
  <!-- Por encima del enlace extendido de la tarjeta -->
  <a
    [routerLink]="['/profile', data.user.id]"
    class="relative z-10 mt-3 inline-flex w-fit items-center gap-2 text-[0.9375rem] hover:underline"
  >
    <app-avatar [user]="data.user" [size]="26"></app-avatar>
    {{ data.user.name }}
  </a>
</article>
